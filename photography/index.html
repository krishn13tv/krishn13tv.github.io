<body>

<header>
  <a href="../" class="logo">Krish Ethan <span>Nair</span></a>

    <span></span>
  </button>
  <nav>
    <ul id="navList">
      <li><a href="../">Home</a></li>
      <li><a href="../photography/" aria-current="page">Photography</a></li>

      <li><a href="../recipes/">Recipes</a></li>

<section class="block">
  <div class="section-head">
    <div>
      <p class="eyebrow">Selected frames</p>
      <h2>Photography</h2>
      <p>A running collection of skies, streets, and everything in between.</p>
    </div>
  </div>

  <!--
    HOW TO ADD YOUR OWN PHOTOS:
    1. Upload image files into the /images folder at the root of the repo.
    2. Replace the src="../images/photoX.jpg" paths below with your actual filenames.
    3. Update the alt text (for accessibility) and the caption text.
    4. To add more photos, copy a whole <figure>...</figure> block and paste it
       before the closing </div> of .gallery, then edit it.
    5. The g1–g8 classes control tile size/shape in the mosaic layout (g1 is the
       big tile, g4–g6 are small squares) — any class works with any photo,
       they just control layout, not content.
  -->
  <div class="gallery">
    <figure class="g1"><img src="../images/photo1.jpg" alt="Describe this photo"><figcaption><span class="eyebrow">01</span><br>Title Here</figcaption></figure>
    <figure class="g2"><img src="../images/photo2.jpg" alt="Describe this photo"><figcaption><span class="eyebrow">02</span><br>Title Here</figcaption></figure>
    <figure class="g3"><img src="../images/photo3.jpg" alt="Describe this photo"><figcaption><span class="eyebrow">03</span><br>Title Here</figcaption></figure>
    <figure class="g4"><img src="../images/photo4.jpg" alt="Describe this photo"><figcaption><span class="eyebrow">04</span><br>Title Here</figcaption></figure>
    <figure class="g5"><img src="../images/photo5.jpg" alt="Describe this photo"><figcaption><span class="eyebrow">05</span><br>Title Here</figcaption></figure>
    <figure class="g6"><img src="../images/photo6.jpg" alt="Describe this photo"><figcaption><span class="eyebrow">06</span><br>Title Here</figcaption></figure>
    <figure class="g7"><img src="../images/photo7.jpg" alt="Describe this photo"><figcaption><span class="eyebrow">07</span><br>Title Here</figcaption></figure>
    <figure class="g8"><img src="../images/photo8.jpg" alt="Describe this photo"><figcaption><span class="eyebrow">08</span><br>Title Here</figcaption></figure>
  </div>
</section>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résumé — Krish Ethan Nair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<header>
  <a href="../" class="logo">Krish Ethan <span>Nair</span></a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span>
  </button>
  <nav>
    <ul id="navList">
      <li><a href="../">Home</a></li>
      <li><a href="../tutoring/">Tutoring Services</a></li>
      <li><a href="../photography/">Photography</a></li>
      <li><a href="../projects/">Projects</a></li>
      <li><a href="../recipes/">Recipes</a></li>
      <li><a href="../resume/" aria-current="page">Résumé</a></li>
      <li><a href="../connect/">Connect</a></li>
    </ul>
  </nav>
</header>

<section class="block">
  <div class="section-head">
    <div>
      <p class="eyebrow">Résumé</p>
      <h2>Résumé</h2>
      <p>Education, experience, and skills — full PDF below.</p>
    </div>
  </div>

  <!--
    TO ADD YOUR ACTUAL RÉSUMÉ:
    1. Upload your PDF to the repo root as "resume.pdf" (same level as index.html
       and styles.css) — or wherever you'd like, just update the two paths below
       ("../resume.pdf") to match.
    2. That's it — the embed and download link both point at the same file.
  -->
  <div style="border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#fff; max-width:820px;">
    <object data="../resume.pdf" type="application/pdf" style="width:100%; height:80vh; display:block;">
      <p style="padding:2rem; color:var(--ink-soft);">
        Your browser can't display the embedded PDF.
        <a href="../resume.pdf" style="color:var(--sky-deep); font-weight:600;">Download the résumé directly</a>.
      </p>
    </object>
  </div>

  <a href="../resume.pdf" class="btn btn-primary-light" style="margin-top:1.6rem;" download>Download Résumé (PDF)</a>
</section>

<footer>
  <span>© 2026 Krish Ethan Nair. Built with clear skies in mind.</span>
  <span><a href="../" style="color:var(--sky-deep); font-weight:600;">Home</a></span>
</footer>

<script>
  const toggle = document.getElementById('navToggle');
  const navList = document.getElementById('navList');
  toggle.addEventListener('click', () => {
    const open = navList.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open);
  });
</script>

</body>
</html>
